  <g stroke="#6f3b4b" stroke-width="4" fill="none">
    <path d="M389 190v-27m222 27v-27m-328 82v-29m548 29v-29"/>
  </g>
  <g fill="#ffd76f" filter="url(#brillo)">
    <path d="M379 159h20l-3 20h-14zm222 0h20l-3 20h-14zm-329 51h18l-3 19h-12zm420 0h18l-3 19h-12z"/>
  </g>
  <!-- Flores que marcan el camino -->
  <g fill="#ffd15d">
    <circle cx="478" cy="168" r="5"/><circle cx="522" cy="168" r="5"/><circle cx="430" cy="188" r="5"/><circle cx="570" cy="188" r="5"/>
    <circle cx="382" cy="222" r="5"/><circle cx="618" cy="222" r="5"/><circle cx="318" cy="267" r="6"/><circle cx="682" cy="267" r="6"/>
    <circle cx="239" cy="322" r="7"/><circle cx="761" cy="322" r="7"/><circle cx="143" cy="389" r="8"/><circle cx="857" cy="389" r="8"/>
  </g>
  <g fill="#f39b39">
    <path d="M25 395q11-17 22 0-11 17-22 0m18 0q11-17 22 0-11 17-22 0m18 0q11-17 22 0-11 17-22 0m-27 16q11-17 22 0-11 17-22 0m18 0q11-17 22 0-11 17-22 0"/>
    <path d="M913 395q11-17 22 0-11 17-22 0m18 0q11-17 22 0-11 17-22 0m18 0q11-17 22 0-11 17-22 0m-27 16q11-17 22 0-11 17-22 0m18 0q11-17 22 0-11 17-22 0"/>
  </g>
</svg>
